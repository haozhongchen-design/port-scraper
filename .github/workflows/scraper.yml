name: Callao Port Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [external_trigger]

permissions:
  contents: write

jobs:
  grind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true 
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install playwright pandas==2.2.3 pytz beautifulsoup4 lxml html5lib

      - name: Install Browser Engine
        run: playwright install chromium --with-deps

      - name: Run Scraper
        run: python callao.py

      - name: Upload Failure Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-screenshot
          path: csv_fail_screenshot.png
          retention-days: 3

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # We only track the data file now, not the image
          git add -f callao_master_data.csv || true
          
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "M5 Update: $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
