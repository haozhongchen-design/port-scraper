name: Callao Port Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [external_trigger]

permissions:
  contents: write

jobs:
  grind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install playwright pandas pytz
             playright install chromium

      - name: Run Callao Scraper
        run: python callao.py

      - name: Commit and Force Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # The Fix: Bypass the crash if the CSV was not generated
          git add -f callao_master_data.csv || true
          
          if git diff --staged --quiet; then
            echo "No market change detected."
          else
            git commit -m "M5 Displacement Update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi
