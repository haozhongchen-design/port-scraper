name: Callao Port Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [external_trigger]

permissions:
  contents: write

jobs:
  grind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        # Fixed typo and pinned stable pandas version
        run: pip install playwright pandas==2.2.3 pytz beautifulsoup4 lxml

      - name: Install Playwright Browsers
        # This must be a separate command to download the Chromium engine
        run: playwright install chromium

      - name: Run Callao Scraper
        run: python callao.py

      - name: Commit and Force Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -f callao_master_data.csv || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "M5 Stealth Update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi
