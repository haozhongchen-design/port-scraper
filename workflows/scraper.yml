name: Global Port Aggregator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' 

permissions:
  contents: write

jobs:
  scrape_ports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pytz

      # Create a data folder to keep the repository clean
      - name: Create Data Directory
        run: mkdir -p data

      - name: Run Processor
        run: python port_scraper.py

      - name: Commit and Force Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -f data/*.csv 
          
          if git diff --staged --quiet; then
            echo "No new vessels detected across any ports."
          else
            git commit -m "Processor Update: $(date +'%Y-%m-%d')"
            git push origin HEAD:main
          fi
